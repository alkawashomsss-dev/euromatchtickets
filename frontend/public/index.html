    <!-- Dynamic SEO: Set canonical + meta from URL before React loads -->
    <script>
      (function(){
        var path = window.location.pathname;
        if (path && path !== '/') {
          var canon = document.getElementById('canonical-tag');
          if (canon) canon.href = 'https://euromatchtickets.com' + path;
          var ogUrl = document.querySelector('meta[property="og:url"]');
          if (ogUrl) ogUrl.content = 'https://euromatchtickets.com' + path;
          
          // Fetch page-specific title from API
          var xhr = new XMLHttpRequest();
          xhr.open('GET', '/api/seo/page-meta?path=' + encodeURIComponent(path), true);
          xhr.timeout = 3000;
          xhr.onload = function() {
            if (xhr.status === 200) {
              try {
                var data = JSON.parse(xhr.responseText);
                if (data.title) document.title = data.title;
                if (data.canonical && canon) canon.href = data.canonical;
              } catch(e) {}
            }
          };
          xhr.send();
        }
      })();
    </script>

    <script>

        });
      };
      // Track search

        gtag('event', 'search', {
          search_term: searchTerm
        });
      };
      // Track view item
      window.trackViewItem = function(eventName, price, category) {
        gtag('event', 'view_item', {
          currency: 'EUR',
          value: price,
          items: [{
            item_name: eventName,
            item_category: category,
            price: price
          }]
        });
      };
    </script>
