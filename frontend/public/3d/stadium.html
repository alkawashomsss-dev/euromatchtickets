<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>3D Stadium</title>
  <meta name="robots" content="noindex"/>
  <style>
    html,body { margin:0; padding:0; height:100%; background:#0b0b0b; overflow:hidden; font-family:-apple-system,sans-serif; color:#fff; }
    #wrap { position:relative; width:100vw; height:100vh; }
    #loader { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#9ab; font-size:13px; letter-spacing:2px; }
    canvas { display:block; width:100% !important; height:100% !important; touch-action:none; cursor:grab; }
    canvas:active { cursor:grabbing; }
    #label { position:absolute; top:12px; left:12px; padding:4px 10px; background:rgba(0,0,0,.45); font-size:10px; letter-spacing:2px; text-transform:uppercase; border:1px solid rgba(255,255,255,.08); }
  </style>
</head>
<body>
<div id="wrap">
  <div id="loader">LOADING STADIUM…</div>
  <div id="label"></div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const PRESETS = {
  allianz_arena: { name:"Allianz Arena", sky:"#0a0a1a",
    pitch:{w:105,h:68},
    tiers:[ {inner:56,outer:70,h0:8,h1:18,sec:24,tint:0x8b0000},
            {inner:72,outer:88,h0:20,h1:34,sec:32,tint:0xa02020},
            {inner:90,outer:108,h0:36,h1:52,sec:40,tint:0xc03030} ],
    roof:{h:62,color:0xe0e0e0,opa:0.35}, arch:false
  },
  wembley: { name:"Wembley Stadium", sky:"#0b1020",
    pitch:{w:105,h:68},
    tiers:[ {inner:56,outer:72,h0:6,h1:16,sec:28,tint:0x1a2d5f},
            {inner:74,outer:92,h0:18,h1:32,sec:36,tint:0x253d7a},
            {inner:94,outer:114,h0:34,h1:50,sec:44,tint:0x2f4d94} ],
    roof:{h:60,color:0xffffff,opa:0.30}, arch:true
  },
  puskas_arena: { name:"Puskás Aréna", sky:"#0a0a1a",
    pitch:{w:105,h:68},
    tiers:[ {inner:58,outer:74,h0:7,h1:18,sec:24,tint:0x8b2323},
            {inner:76,outer:96,h0:20,h1:36,sec:34,tint:0xa43030} ],
    roof:{h:48,color:0xdddddd,opa:0.30}, arch:false
  },
  santiago_bernabeu: { name:"Santiago Bernabéu", sky:"#0e0e18",
    pitch:{w:105,h:68},
    tiers:[ {inner:54,outer:70,h0:8,h1:20,sec:24,tint:0x6f6f6f},
            {inner:72,outer:90,h0:22,h1:38,sec:32,tint:0x8a8a8a},
            {inner:92,outer:112,h0:40,h1:58,sec:40,tint:0xa5a5a5} ],
    roof:{h:66,color:0xf0f0f0,opa:0.40}, arch:false
  },
  camp_nou: { name:"Camp Nou", sky:"#0a0a18",
    pitch:{w:105,h:68},
    tiers:[ {inner:58,outer:76,h0:7,h1:20,sec:28,tint:0x7f1d1d},
            {inner:78,outer:98,h0:22,h1:38,sec:36,tint:0xa02030},
            {inner:100,outer:122,h0:40,h1:58,sec:44,tint:0xc54060} ],
    roof:null, arch:false
  }
};

const qs = new URLSearchParams(location.search);
const preset = PRESETS[qs.get('p')] || PRESETS.allianz_arena;
document.getElementById('label').textContent = preset.name;

const wrap = document.getElementById('wrap');
const loader = document.getElementById('loader');

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:"high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(preset.sky);
scene.fog = new THREE.Fog(preset.sky, 260, 520);

const camera = new THREE.PerspectiveCamera(38, wrap.clientWidth / wrap.clientHeight, 1, 800);
camera.position.set(120, 80, 160);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 80; controls.maxDistance = 260;
controls.maxPolarAngle = Math.PI * 0.42; controls.minPolarAngle = Math.PI * 0.12;
controls.autoRotate = true; controls.autoRotateSpeed = 0.45;

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const d1 = new THREE.DirectionalLight(0xffffff, 0.9);
d1.position.set(80, 140, 60);
scene.add(d1);
const p1 = new THREE.PointLight(0xffc97a, 0.8, 400);
p1.position.set(-60, 30, 60);
scene.add(p1);
const p2 = new THREE.PointLight(0x7ab0ff, 0.8, 400);
p2.position.set(60, 30, -60);
scene.add(p2);
scene.add(new THREE.HemisphereLight(0x4a5a7f, 0x0c2c0c, 0.5));

// Pitch
const pitchGeom = new THREE.PlaneGeometry(preset.pitch.w, preset.pitch.h);
const pitchMat = new THREE.MeshStandardMaterial({ color: 0x1b5e20, roughness: 0.9 });
const pitch = new THREE.Mesh(pitchGeom, pitchMat);
pitch.rotation.x = -Math.PI / 2;
pitch.position.y = 0.1;
scene.add(pitch);

// Pitch markings
const ring = new THREE.Mesh(
  new THREE.RingGeometry(9.15, 9.3, 64),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent:true, opacity:0.6 })
);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.12;
scene.add(ring);

// Halfway line
const half = new THREE.Mesh(
  new THREE.BoxGeometry(preset.pitch.w, 0.02, 0.3),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent:true, opacity:0.3 })
);
half.position.y = 0.12;
half.rotation.y = Math.PI / 2;
scene.add(half);

// Tiers — ring of wedge-prisms
preset.tiers.forEach((tier) => {
  const { inner, outer, h0, h1, sec, tint } = tier;
  const mat = new THREE.MeshStandardMaterial({ color: tint, roughness: 0.75 });
  for (let i = 0; i < sec; i++) {
    const a0 = (i / sec) * Math.PI * 2;
    const a1 = ((i + 1) / sec) * Math.PI * 2;
    const shape = new THREE.Shape();
    shape.moveTo(Math.cos(a0) * inner, Math.sin(a0) * inner);
    shape.lineTo(Math.cos(a0) * outer, Math.sin(a0) * outer);
    shape.lineTo(Math.cos(a1) * outer, Math.sin(a1) * outer);
    shape.lineTo(Math.cos(a1) * inner, Math.sin(a1) * inner);
    shape.closePath();
    const geom = new THREE.ExtrudeGeometry(shape, { depth: h1 - h0, bevelEnabled: false });
    geom.rotateX(-Math.PI / 2);
    geom.translate(0, h1, 0);
    geom.computeBoundingSphere();
    scene.add(new THREE.Mesh(geom, mat));
  }
});

// Roof
if (preset.roof) {
  const roofGeom = new THREE.SphereGeometry(130, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2);
  const roofMat = new THREE.MeshPhysicalMaterial({
    color: preset.roof.color, roughness:0.2, metalness:0.05,
    transmission:0.4, opacity: preset.roof.opa, transparent:true,
    side: THREE.DoubleSide
  });
  const roof = new THREE.Mesh(roofGeom, roofMat);
  roof.position.y = preset.roof.h;
  roof.rotation.x = Math.PI;
  scene.add(roof);
}

// Wembley arch
if (preset.arch) {
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-100,0,0),
    new THREE.Vector3(-60,80,0),
    new THREE.Vector3(0,100,0),
    new THREE.Vector3(60,80,0),
    new THREE.Vector3(100,0,0)
  ]);
  const tube = new THREE.TubeGeometry(curve, 64, 1.4, 12, false);
  tube.computeBoundingSphere();
  const arch = new THREE.Mesh(tube, new THREE.MeshStandardMaterial({ color:0xf5f5f5, roughness:0.3, metalness:0.6 }));
  scene.add(arch);
}

// Resize
function onResize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
addEventListener('resize', onResize);
const ro = new ResizeObserver(onResize);
ro.observe(wrap);

let raf = 0;
function tick() {
  raf = requestAnimationFrame(tick);
  controls.update();
  renderer.render(scene, camera);
}
tick();

loader.style.display = 'none';

addEventListener('pagehide', () => {
  cancelAnimationFrame(raf);
  renderer.dispose();
  ro.disconnect();
});
</script>
</body>
</html>
