services:
  - type: web
    name: euromatchtickets
    runtime: python
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: cd backend && python -m uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.12
      - key: NODE_VERSION
        value: 18
